<iframe
  class="app-embedded-visualization--iframe"
  width="100%"
  height="100%"
  sandbox="allow-forms allow-same-origin allow-scripts"
  [src]="iframeUrl()"
>
</iframe>

<div class="app-embedded-visualization--overlay" [class.app-embedded-visualization--overlay-active]="isLoading()">
  <div class="app-embedded-visualization-overlay-content">
    <mat-progress-spinner mode="determinate" diameter="180" [value]="loadingProgress()" />
  </div>
</div>
