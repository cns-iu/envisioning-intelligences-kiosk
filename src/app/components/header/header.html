<header class="app-header--header">
  <a class="app-header--logo" routerLink="/" aria-label="Home">
    <app-logo />
  </a>
  @if (title(); as titleValue) {
    <span class="app-header--title">{{ titleValue }}</span>
  }
  <div class="app-header--actions">
    <a matButton class="app-header--button" routerLink="/">Home</a>
    <button matButton class="app-header--button" (click)="aboutClick.emit()">About</button>
  </div>
</header>
