sections:
  - title: Description
    content: |
      Intelligence has often been considered a uniquely human trait. However, recent developments in the study of plants and animals, as well as breakthroughs in the realm of machine learning, have expanded our understanding of what is intelligent. These days, it is not uncommon to read about the language of trees and the cognitive ability of cephalopods on devices we refer to as smart phones.

      What does intelligence look like when exhibited by humans or machines, plants or animals?

      How do different types of intelligence interact and cooperate in order to survive and thrive?

      Looking at human intelligence alongside that of microbes, plants, animals, and machines can help us find ways to work together and identify blind spots in our own ways of thinking.

      *Envisioning Intelligences* is curated by the Cyberinfrastructure for Network Science Center at Indiana University.
